name: Bug report
description: Something in DM Bank Night City Edition doesn't work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please report bugs in this fork here or in `#cyberpunk-red` on Discord, **not to The Project Red Team**.
        Worlds moved from the official Cyberpunk RED Core aren't supported yet (see README, "Existing worlds").
  - type: input
    id: foundry-version
    attributes:
      label: Foundry version
      description: Setup screen → bottom right, e.g. "14.350" or "13.348".
    validations:
      required: true
  - type: input
    id: system-version
    attributes:
      label: System version
      description: Game Systems tab, e.g. "1.0.0".
    validations:
      required: true
  - type: dropdown
    id: world
    attributes:
      label: Which world?
      options:
        - A new world created with DM Bank Night City Edition
        - A world moved from the official Cyberpunk RED Core
    validations:
      required: true
  - type: textarea
    id: modules
    attributes:
      label: Active Modules
      description: List the active Modules, or write "none". Please try once with all Modules off if you can.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Open a character sheet
        2. Click …
        3. …
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console log
      description: Press F12, open the Console tab, reproduce the bug, and paste the red errors here.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
    validations:
      required: false
